<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Sport X Hub — a professional sports talent marketplace connecting players and clubs. Build a profile, get discovered, get contacted.">
  <meta name="keywords" content="sports talent marketplace, football players, club scouting, player profiles, sports recruitment">
  <meta name="theme-color" content="#0B0E14">
  <meta name="robots" content="index, follow">
  <!-- Placeholder — replace with the real production domain at deploy time,
       and update web/sitemap.xml / web/robots.txt to match. -->
  <link rel="canonical" href="https://sportxhub.com/">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sport X Hub">
  <meta property="og:title" content="Sport X Hub — Where players get discovered">
  <meta property="og:description" content="A Player builds a credible profile. A Club finds that player through search. A Club contacts them directly.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Sport X Hub — Where players get discovered">
  <meta name="twitter:description" content="A professional sports talent marketplace connecting players and clubs.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sport X Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sport X Hub — Where players get discovered</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

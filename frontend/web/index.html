<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!--
    Without this, a phone renders the page at a ~980px desktop width and then
    scales it down — the single biggest reason the app read as a shrunken web
    page rather than an app. `viewport-fit=cover` lets the app paint edge to
    edge behind the notch and home indicator; the real inset values are handed
    to Flutter by the safe-area probe below, since Flutter Web does not
    populate `MediaQuery.padding` from `env(safe-area-inset-*)` on its own.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Sport X Hub — a professional sports talent marketplace connecting players and clubs. Build a profile, get discovered, get contacted.">
  <meta name="keywords" content="sports talent marketplace, football players, club scouting, player profiles, sports recruitment">
  <!--
    Single dark value on purpose, not a light/dark pair: ThemeModeController
    starts every session in dark mode and does not persist the user's toggle
    (see lib/core/theme/theme_mode_provider.dart), so a light `theme-color`
    behind `prefers-color-scheme: light` would paint the browser chrome white
    around an app that is still dark. Revisit if the toggle becomes persisted.
  -->
  <meta name="theme-color" content="#0B0E14">
  <meta name="robots" content="index, follow">
  <!-- Placeholder — replace with the real production domain at deploy time,
       and update web/sitemap.xml / web/robots.txt to match. -->
  <link rel="canonical" href="https://sportxhub.com/">

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sport X Hub">
  <meta property="og:title" content="Sport X Hub — Where players get discovered">
  <meta property="og:description" content="A Player builds a credible profile. A Club finds that player through search. A Club contacts them directly.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Sport X Hub — Where players get discovered">
  <meta name="twitter:description" content="A professional sports talent marketplace connecting players and clubs.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- `black-translucent` lets the app's own background run under the status
       bar instead of stranding a solid black strip above it. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sport X Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!--
    iOS is the only platform that ignores manifest.json's `background_color`
    on launch, showing a blank white screen unless a launch image matching the
    device's exact pixel size is declared. Regenerate with
    `python tool/generate_ios_splash.py` if the logo or brand color changes.
  -->
  <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-440x956@3x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-430x932@3x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-428x926@3x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-414x896@3x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/launch-414x896@2x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-414x736@3x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-402x874@3x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-393x852@3x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-390x844@3x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/launch-375x812@3x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/launch-375x667@2x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/launch-1024x1366@2x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/launch-834x1194@2x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/launch-820x1180@2x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/launch-810x1080@2x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/launch-768x1024@2x.png">
  <link rel="apple-touch-startup-image" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/launch-744x1133@2x.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sport X Hub — Where players get discovered</title>
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      /* AppColors.black / brandBlue / brandBlueLight — kept in sync with
         lib/core/theme/app_colors.dart by hand; this stylesheet runs before
         any Dart code exists, so it cannot read the Flutter theme. */
      --sxh-bg: #0B0E14;
      --sxh-brand: #1476FF;
      --sxh-brand-light: #4FC3F7;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: var(--sxh-bg);
      overflow: hidden;
      /* Kills the rubber-band bounce of the *page* behind the app. Flutter's
         own scroll views keep their bounce; this only stops the whole canvas
         sliding around, which is the tell of a web page inside a browser. */
      overscroll-behavior: none;
    }

    body {
      /* App-like touch handling: no long-press callout menu, no double-tap
         zoom lag, no blue tap flash, no accidental text selection while
         scrolling. Flutter's own text fields opt back into selection below. */
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }

    /* Flutter renders editable text into real DOM nodes — those must stay
       selectable or copy/paste and the caret break. */
    input, textarea, [contenteditable="true"], flt-text-editing-host {
      -webkit-user-select: text;
      user-select: text;
    }

    /* Boot screen. Painted by the browser immediately, long before
       main.dart.js is parsed, and removed by web/flutter_bootstrap.js once
       Flutter has actually rendered. Deliberately mirrors the iOS launch
       images above (same background, same logo, same ~46% sizing) so the
       handoff between them is invisible. */
    #sxh-loader {
      position: fixed;
      inset: 0;
      z-index: 2147483647;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background-color: var(--sxh-bg);
      opacity: 1;
      transition: opacity 320ms ease-in;
    }

    /* Set by flutter_bootstrap.js right before the element is removed. */
    #sxh-loader.sxh-loader--done {
      opacity: 0;
      pointer-events: none;
    }

    #sxh-loader img {
      width: min(46vmin, 260px);
      height: auto;
      /* One gentle breath while loading — enough to read as "working"
         without competing with the progress bar. */
      animation: sxh-pulse 1600ms ease-in-out infinite;
    }

    #sxh-loader .sxh-loader__track {
      width: min(38vmin, 200px);
      height: 3px;
      border-radius: 999px;
      overflow: hidden;
      background-color: rgba(255, 255, 255, 0.10);
    }

    #sxh-loader .sxh-loader__bar {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--sxh-brand), var(--sxh-brand-light));
      animation: sxh-slide 1200ms ease-in-out infinite;
    }

    @keyframes sxh-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.72; }
    }

    @keyframes sxh-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    /* Respect a reduced-motion preference: the loader still shows, it just
       stops moving. */
    @media (prefers-reduced-motion: reduce) {
      #sxh-loader img,
      #sxh-loader .sxh-loader__bar {
        animation: none;
      }
      #sxh-loader .sxh-loader__bar { width: 100%; }
    }
  </style>

  <script>
    // Flutter Web does not read `env(safe-area-inset-*)` into
    // `MediaQuery.padding`, so with `viewport-fit=cover` above the app would
    // happily paint its bottom navigation underneath the iPhone home
    // indicator. This probe measures the real insets and exposes them to
    // Dart, which reads them through lib/core/utils/safe_area_insets_web.dart
    // and injects them into MediaQuery. Kept inline (not in a module) so the
    // values exist before the first Flutter frame.
    (function () {
      var probe = document.createElement('div');
      probe.style.cssText = [
        'position:fixed',
        'top:0',
        'left:0',
        'width:0',
        'height:0',
        'visibility:hidden',
        'pointer-events:none',
        'padding-top:env(safe-area-inset-top, 0px)',
        'padding-right:env(safe-area-inset-right, 0px)',
        'padding-bottom:env(safe-area-inset-bottom, 0px)',
        'padding-left:env(safe-area-inset-left, 0px)',
      ].join(';');

      function attach() {
        document.body.appendChild(probe);
      }

      if (document.body) {
        attach();
      } else {
        document.addEventListener('DOMContentLoaded', attach);
      }

      // Returns "top,right,bottom,left" in CSS pixels. A string rather than an
      // object keeps the Dart side to a single `external String` binding with
      // no JS interop type plumbing. Read on every MediaQuery rebuild, so
      // rotating the device picks up the new insets for free.
      window.sxhSafeAreaInsets = function () {
        if (!probe.isConnected) return '0,0,0,0';
        var style = window.getComputedStyle(probe);
        return [
          parseFloat(style.paddingTop) || 0,
          parseFloat(style.paddingRight) || 0,
          parseFloat(style.paddingBottom) || 0,
          parseFloat(style.paddingLeft) || 0,
        ].join(',');
      };
    })();
  </script>
</head>
<body>
  <div id="sxh-loader" role="status" aria-live="polite" aria-label="Loading Sport X Hub">
    <img src="icons/Icon-512.png" alt="Sport X Hub">
    <span class="sxh-loader__track"><span class="sxh-loader__bar"></span></span>
  </div>

  <!--
    Customized in web/flutter_bootstrap.js — it drives the same standard
    loader, and additionally dismisses #sxh-loader once the first Flutter
    frame is on screen.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

# Sport X Hub — host nginx. Terminates TLS for both names and proxies to the
# containers, which listen on localhost only.
#
# Install:  /etc/nginx/sites-available/sportxhup.conf  (symlinked into
#           sites-enabled), then `nginx -t && systemctl reload nginx`.
#
# The `listen 443 ssl` blocks and the certificate paths below are what
# certbot writes for you if you run it *after* putting the port-80 blocks in
# place; see docs/DEPLOYMENT_SELF_HOSTED.md. Everything else here is ours.

# ----------------------------------------------------------------- redirect
# Plain HTTP exists only to answer ACME challenges and to send everyone to
# HTTPS. Web Push and service workers both require a secure context, so an
# app served over HTTP is not merely less safe — half of it does not run.
server {
    listen 80;
    listen [::]:80;
    server_name sportxhup.com www.sportxhup.com api.sportxhup.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------- api
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.sportxhup.com;

    ssl_certificate     /etc/letsencrypt/live/api.sportxhup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sportxhup.com/privkey.pem;

    # Profile photos and club logos go to Cloudinary, but video uploads and
    # multipart images pass through here. nginx's 1 MB default would reject
    # them with a 413 long before the app's own limits applied.
    client_max_body_size 50m;

    # Video uploads over a slow connection legitimately take minutes; the
    # 60s default would cut them off mid-stream.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The API reads none of these itself today, but a reverse proxy that
        # hides the client is how rate limiting silently starts counting
        # every request as coming from one address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------- web
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sportxhup.com www.sportxhup.com;

    ssl_certificate     /etc/letsencrypt/live/sportxhup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sportxhup.com/privkey.pem;

    # Compression, caching, and the SPA fallback all live in the container's
    # own nginx (frontend/docker/nginx.conf.template) — this one only needs
    # to hand the request over.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
